name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"

      # pytest-homeassistant-custom-component follows Home Assistant's own
      # floor, which is 3.14 as of 2026.8. Bump this when that moves.
      - name: Set up Python
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements.test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements.test.txt

      - name: Run pytest
        run: pytest
